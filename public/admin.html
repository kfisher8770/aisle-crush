<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Haaave you met…?</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #f4f2ef; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1.2rem; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .muted { color: var(--text-muted); font-size: 13px; margin-bottom: 1.2rem; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); }
  .assign-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .assign-row input { flex: 1; }
  .danger { background: var(--red-text); color: #fff; }
  .danger:hover { background: #7d1f1f; }
  pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 10px; overflow: auto; font-size: 11.5px; max-height: 360px; }
  .evt-thumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; vertical-align: middle; }
  .stat { display: inline-block; background: var(--pink-light); color: var(--pink-dark); border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 700; margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Admin — Haaave you met…?</h1>
  <div class="muted">Manage wingman ↔ single assignments, review everything logged, and reset for a fresh run.</div>

  <div class="card">
    <div class="label" style="margin-bottom:10px">Wingman → Single assignments</div>
    <div id="assignments"></div>
    <button class="btn btn-outline btn-sm" style="margin-top:6px" onclick="addAssignRow()">＋ Add row</button>
    <button class="btn btn-pink" style="margin-top:10px" onclick="saveAssignments()">Save assignments</button>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:10px">Leaderboard</div>
    <div id="lb"></div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:10px">Profiles &amp; logged events</div>
    <div id="profiles"></div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:10px">Danger zone</div>
    <button class="btn danger" onclick="resetProfiles()">Reset all profiles &amp; events (keep assignments)</button>
    <button class="btn btn-outline" onclick="resetAll()">Wipe EVERYTHING (incl. assignments)</button>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:10px">Raw data</div>
    <pre id="raw"></pre>
  </div>
</div>

<script>
async function load() {
  const data = await (await fetch('/api/admin/data')).json();
  const lb = await (await fetch('/api/leaderboard')).json();
  renderAssignments(data.assignments || []);
  document.getElementById('raw').textContent = JSON.stringify(data, null, 2);

  document.getElementById('lb').innerHTML = lb.length
    ? '<table><tr><th>#</th><th>Wingman</th><th>Singles</th><th>Points</th></tr>' +
      lb.map((r, i) => `<tr><td>${i + 1}</td><td><b>${r.wingman}</b></td><td>${(r.singles || []).join(', ')}</td><td>${r.points}</td></tr>`).join('') + '</table>'
    : '<div class="muted">No data yet.</div>';

  document.getElementById('profiles').innerHTML = (data.profiles || []).length
    ? (data.profiles || []).map(p => `
      <div style="border-bottom:1px solid var(--border);padding:10px 0">
        <div><b>${p.singleName}</b> ${p.age ? '· ' + p.age : ''} <span class="muted">by ${p.createdBy}${p.selfMade ? ' (self)' : ''}</span></div>
        <div style="margin:5px 0">
          <span class="stat">🔁 ${(p.reactions || []).length} reactions</span>
          <span class="stat">💍 ${(p.matches || []).length} matches</span>
          <span class="stat">📸 ${(p.events || []).length} events</span>
          <span class="stat">🍺 lvl ${p.drinkLevel || 0}</span>
        </div>
        ${(p.events || []).length ? '<table>' + (p.events || []).map(e => `<tr><td>${e.photoUrl ? `<img class="evt-thumb" src="${e.photoUrl}">` : ''}</td><td>${e.emoji || ''} ${e.label}</td><td>+${e.points}</td></tr>`).join('') + '</table>' : ''}
      </div>`).join('')
    : '<div class="muted">No profiles yet.</div>';
}

function renderAssignments(arr) {
  document.getElementById('assignments').innerHTML = '';
  (arr.length ? arr : [{ wingman: '', single: '' }]).forEach(a => addAssignRow(a.wingman, a.single));
}
function addAssignRow(w = '', s = '') {
  const div = document.createElement('div');
  div.className = 'assign-row';
  div.innerHTML = `<input type="text" placeholder="Wingman" value="${String(w).replace(/"/g, '&quot;')}"><input type="text" placeholder="Single" value="${String(s).replace(/"/g, '&quot;')}"><button class="icon-btn" onclick="this.parentElement.remove()">🗑️</button>`;
  document.getElementById('assignments').appendChild(div);
}
async function saveAssignments() {
  const rows = [...document.querySelectorAll('#assignments .assign-row')].map(r => {
    const [w, s] = r.querySelectorAll('input');
    return { wingman: w.value.trim(), single: s.value.trim() };
  }).filter(a => a.wingman && a.single);
  await fetch('/api/admin/assignments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ assignments: rows }) });
  alert('Saved!'); load();
}
async function resetProfiles() { if (!confirm('Delete all profiles & events? Assignments are kept.')) return; await fetch('/api/admin/reset', { method: 'POST' }); load(); }
async function resetAll() { if (!confirm('Wipe EVERYTHING including assignments?')) return; await fetch('/api/admin/reset-all', { method: 'POST' }); load(); }
load();
</script>
</body>
</html>
